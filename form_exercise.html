<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <main class="container">
        <h1 class="title">Calculadora de IMC</h1>
        
        <div class="input-group">
            <label for="peso">Peso (em kg)</label>
            <input type="number" id="peso" placeholder="Ex: 75.5" step="0.1" required>
        </div>
        
        <div class="input-group">
            <label for="altura">Altura (em metros)</label>
            <input type="number" id="altura" placeholder="Ex: 1.78" step="0.01" required>
        </div>
        
        <button id="calcularBtn">Calcular</button>
        
        <div id="resultado" class="resultado-container"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
